<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
    <pattern id="argyle" width="120" height="160" patternUnits="userSpaceOnUse">
      <rect width="120" height="160" fill="#0A1018"/>
      <polygon points="60,0 120,80 60,160 0,80" fill="#23344A"/>
      <polygon points="0,0 60,80 0,160" fill="#16222F"/>
      <polygon points="120,0 60,80 120,160" fill="#16222F"/>
      <g stroke="#7CA0C8" stroke-width="2" opacity="0.30" stroke-dasharray="6 7">
        <path d="M60 -80 L200 80 M60 -80 L-80 80 M60 80 L200 240 M60 80 L-80 240 M60 240 L200 400 M60 240 L-80 400"/>
      </g>
    </pattern>
  </defs>
  <g clip-path="url(#tile)"><rect x="16" y="16" width="480" height="480" fill="url(#argyle)"/></g>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#7CA0C8" stroke-width="6"/>

  <!-- Cute cartoon walrus in the raccoon/beaver line-art style: accent-blue fill
       with dark outlines. Big friendly eyes + brows, broad bilobed muzzle with
       whisker dots, dark nose, and the signature pair of tusks. -->
  <g stroke-linejoin="round">
    <!-- head dome -->
    <path d="M256 112 C352 112 410 178 410 262 C410 330 366 384 256 384
             C146 384 102 330 102 262 C102 178 160 112 256 112 Z"
          fill="#7CA0C8" stroke="#0B1622" stroke-width="7"/>

    <!-- brows -->
    <g fill="none" stroke="#0B1622" stroke-width="7" stroke-linecap="round">
      <path d="M180 182 Q206 166 232 180"/>
      <path d="M280 180 Q306 166 332 182"/>
    </g>

    <!-- eyes: dark with glossy catchlights -->
    <ellipse cx="206" cy="212" rx="17" ry="21" fill="#0B1622"/>
    <ellipse cx="306" cy="212" rx="17" ry="21" fill="#0B1622"/>
    <circle cx="213" cy="204" r="7" fill="#EAF1F8"/>
    <circle cx="313" cy="204" r="7" fill="#EAF1F8"/>
    <circle cx="200" cy="219" r="3.5" fill="#EAF1F8"/>
    <circle cx="300" cy="219" r="3.5" fill="#EAF1F8"/>

    <!-- bilobed muzzle pad -->
    <path d="M158 306
             C154 268 176 248 208 250
             C230 252 244 262 256 266
             C268 262 282 252 304 250
             C336 248 358 268 354 306
             C352 346 326 380 300 382
             C282 383 268 373 256 360
             C244 373 230 383 212 382
             C186 380 160 346 158 306 Z"
          fill="#9DBBD9" stroke="#0B1622" stroke-width="7"/>
    <!-- center crease between the two lobes -->
    <path d="M256 300 L256 358" fill="none" stroke="#0B1622" stroke-width="5" stroke-linecap="round"/>

    <!-- nose sitting at the top-center of the muzzle -->
    <path d="M226 254 C240 244 272 244 286 254 C296 262 294 280 280 288
             C270 294 242 294 232 288 C218 280 216 262 226 254 Z" fill="#0B1622"/>

    <!-- whisker dots -->
    <g fill="#0B1622">
      <circle cx="184" cy="316" r="4"/><circle cx="208" cy="324" r="4"/><circle cx="232" cy="318" r="4"/>
      <circle cx="194" cy="342" r="4"/><circle cx="218" cy="348" r="4"/>
      <circle cx="328" cy="316" r="4"/><circle cx="304" cy="324" r="4"/><circle cx="280" cy="318" r="4"/>
      <circle cx="318" cy="342" r="4"/><circle cx="294" cy="348" r="4"/>
    </g>

    <!-- tusks -->
    <g fill="#EAF1F8" stroke="#0B1622" stroke-width="5">
      <path d="M236 348 C226 376 220 402 225 418 C226 425 214 425 211 417
               C204 396 213 368 224 348 Z"/>
      <path d="M276 348 C286 376 292 402 287 418 C286 425 298 425 301 417
               C308 396 299 368 288 348 Z"/>
    </g>
  </g>
</svg>

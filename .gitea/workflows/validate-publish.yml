name: validate-publish
on: [push]
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact
        run: |
          set -eux
          mkdir -p out
          echo "orca-runner-validation $(date -u +%FT%TZ)" > out/artifact.txt
          sha256sum out/artifact.txt
      - name: publish prerelease to GitHub then verify
        env:
          GH_TOKEN: ${{ secrets.VALIDATE_GH_TOKEN }}
        run: |
          set -eux
          if [ -z "${GH_TOKEN}" ]; then echo "VALIDATE_GH_TOKEN EMPTY"; exit 3; fi
          TAG="runner-validate-${GITHUB_SHA::8}"
          API=https://api.github.com/repos/argyle-labs/walrus
          # create prerelease
          RID=$(curl -sS -X POST -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "$API/releases" -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"prerelease\":true,\"body\":\"orca runner validation\"}" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))')
          echo "release id=$RID"
          test -n "$RID"
          # upload asset
          curl -sS -X POST -H "Authorization: token ${GH_TOKEN}" -H "Content-Type: text/plain" \
            "https://uploads.github.com/repos/argyle-labs/walrus/releases/$RID/assets?name=artifact.txt" \
            --data-binary @out/artifact.txt | python3 -c 'import sys,json;print("asset:",json.load(sys.stdin).get("state"))'
          echo "PUBLISH_OK release_id=$RID tag=$TAG"
